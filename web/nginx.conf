server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        # 技能 zip 以 base64 JSON 上传，放宽到 128m（后端按路由二次限制）
        client_max_body_size 128m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # 嵌入防护：仅允许同源 + AIOP_FRAME_ANCESTORS 白名单（如 AIOS 宿主域名）嵌入。
        # 值由 nginx 镜像 envsubst 模板机制注入（Deployment 里设置 AIOP_FRAME_ANCESTORS，默认空 = 仅同源）。
        add_header Content-Security-Policy "frame-ancestors 'self' ${AIOP_FRAME_ANCESTORS}" always;
    }
}
