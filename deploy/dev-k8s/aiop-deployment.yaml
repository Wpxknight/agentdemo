apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiop-server
  namespace: aiop-dev
  labels: { app: aiop, component: server }
spec:
  # Interactive approvals are process-local and tied to one live SSE connection.
  replicas: 1
  selector:
    matchLabels: { app: aiop, component: server }
  template:
    metadata:
      labels: { app: aiop, component: server }
    spec:
      containers:
        - name: aiop-web
          image: aiop-web:dev
          imagePullPolicy: IfNotPresent
          env:
            # CSP frame-ancestors 追加白名单（嵌入 AIOS 时填宿主域名，如 https://aios.example.com）；空 = 仅同源
            - name: AIOP_FRAME_ANCESTORS
              value: ""
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
        - name: aiop
          image: aiop:dev
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "serve"]
          ports:
            - containerPort: 8081
          env:
            - name: AIOP_CONFIG
              value: /config/config.jsonc
            - name: PORT
              value: "8081"
            - name: AIOP_EMBED_SCHEDULER
              value: "true"
          envFrom:
            - secretRef: { name: aiop-dev-secrets }
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: aiop-config }
