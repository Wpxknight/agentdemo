apiVersion: v1
kind: ConfigMap
metadata:
  name: aiop-config
  namespace: aiop-dev
data:
  config.jsonc: |
    {
      "models": {
        "glm-5": {
          "protocol": "anthropic",
          "baseURL": "http://192.168.10.108:18317",
          "apiKey": "${OPENAI_API_KEY}",
          "model": "glm-5"
        }
      },
      "defaultModel": "glm-5",
      "skills": { "dir": "./skills" },
      "auth": {
        "provider": "local",
        "jwtTtl": "12h"
      },
      "sandbox": {
        "enabled": false,
        "provider": "e2b",
        "idleMs": 600000,
        "timeoutMs": 3600000,
        "desktop": false
      }
    }
