apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiop-ops
  namespace: aiop-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiop-ops
  namespace: aiop-dev
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/log", "services", "deployments", "replicasets", "statefulsets", "jobs", "cronjobs", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiop-ops
  namespace: aiop-dev
subjects:
  - kind: ServiceAccount
    name: aiop-ops
    namespace: aiop-dev
roleRef:
  kind: Role
  name: aiop-ops
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiop-readonly
  namespace: aiop-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiop-readonly
  namespace: aiop-dev
subjects:
  - kind: ServiceAccount
    name: aiop-readonly
    namespace: aiop-dev
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
