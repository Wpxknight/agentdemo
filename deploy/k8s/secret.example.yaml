# 复制为 secret.yaml，填真实值后 apply（勿提交真实密钥）。
# stringData 用明文填写，k8s 自动 base64；MYSQL_PASSWORD_BASE64 例外——
# 应用层要求该值本身就是 base64（echo -n 'pw' | base64），故这里填 base64 后的串。
apiVersion: v1
kind: Secret
metadata:
  name: aiop-secrets
  namespace: aiop
type: Opaque
stringData:
  AIOP_JWT_SECRET: "change-me-to-a-strong-random-value"
  ANTHROPIC_API_KEY: "sk-ant-..."
  MYSQL_HOST: "mysql.db.internal"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "ai_ops"
  MYSQL_USER: "ai_ops"
  MYSQL_PASSWORD_BASE64: "eW91ci1wYXNzd29yZA=="
  # E2B_API_KEY: "e2b_..."
  # OIDC_CLIENT_SECRET: "..."
