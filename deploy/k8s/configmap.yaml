apiVersion: v1
kind: ConfigMap
metadata:
  name: aiop-config
  namespace: aiop
data:
  config.jsonc: |
    {
      "models": {
        "my-claude": {
          "protocol": "anthropic",
          "baseURL": "https://api.anthropic.com",
          "apiKey": "${ANTHROPIC_API_KEY}",
          "model": "claude-opus-4-8"
        }
      },
      "defaultModel": "my-claude",
      "skills": { "dir": "./skills" },
      "auth": { "provider": "local" },
      "sandbox": {
        "enabled": true,
        "provider": "opensandbox",
        "domain": "opensandbox-server.opensandbox-system.svc:80",
        "protocol": "http",
        "defaultImage": "aiop/opensandbox-browser:latest",
        "idleMs": 600000,
        "timeoutMs": 3600000,
        "desktop": true
      }
    }
