# 运维目标集群内的 ServiceAccount + RBAC 示例。
# in-cluster kubectl 沙箱（E2B 模板）以这些 SA 的 token 运行，
# 集群侧权限是 OpsPolicy 之外的第二道边界——即便应用层判定有误，k8s 仍兜底。
# 在【被运维的目标集群】apply（可能不是 aiop 自身所在集群）。
---
# 读写 SA：限定在 aiop 命名空间内增删改查
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiop-ops
  namespace: aiop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiop-ops
  namespace: aiop
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/log", "services", "deployments", "replicasets", "statefulsets", "jobs", "cronjobs", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiop-ops
  namespace: aiop
subjects:
  - kind: ServiceAccount
    name: aiop-ops
    namespace: aiop
roleRef:
  kind: Role
  name: aiop-ops
  apiGroup: rbac.authorization.k8s.io
---
# 只读 SA：全集群只读（生产集群用，配合 config.access=ro）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiop-readonly
  namespace: aiop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiop-readonly
subjects:
  - kind: ServiceAccount
    name: aiop-readonly
    namespace: aiop
roleRef:
  kind: ClusterRole
  name: view # k8s 内置只读聚合角色
  apiGroup: rbac.authorization.k8s.io
