apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiop-scheduler
  namespace: aiop
  labels: { app: aiop, component: scheduler }
spec:
  # 单副本即可；多副本也安全（DB FOR UPDATE SKIP LOCKED 去重）
  replicas: 1
  selector:
    matchLabels: { app: aiop, component: scheduler }
  template:
    metadata:
      labels: { app: aiop, component: scheduler }
    spec:
      containers:
        - name: aiop
          image: aiop:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "scheduler"]
          env:
            - name: AIOP_CONFIG
              value: /config/config.jsonc
          envFrom:
            - secretRef: { name: aiop-secrets }
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: aiop-config }
