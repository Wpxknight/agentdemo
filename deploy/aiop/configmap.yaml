apiVersion: v1
kind: ConfigMap
metadata:
  name: aiop-config
  namespace: aios-system
  annotations:
    aiop.bocloud.com/deployment-mode: standalone
data:
  config.jsonc: |
    {
      "deploymentMode": "standalone",
      "models": {
        "glm-5": {
          "protocol": "anthropic",
          "baseURL": "http://192.168.10.108:18317",
          "apiKey": "${OPENAI_API_KEY}",
          "model": "glm-5"
        }
      },
      "defaultModel": "glm-5",
      "skills": {
        "dir": "/skills-data",
        "builtinDir": "/app/skills",
        "requireDistributedLock": true
      },
      "auth": {
        "provider": "local",
        "jwtTtl": "12h"
      },
      "sandbox": {
        "enabled": false,
        "provider": "opensandbox",
        "idleMs": 600000,
        "timeoutMs": 3600000,
        "desktop": false
      }
    }
