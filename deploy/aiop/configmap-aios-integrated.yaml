apiVersion: v1
kind: ConfigMap
metadata:
  name: aiop-config
  namespace: aios-system
  annotations:
    aiop.bocloud.com/deployment-mode: aios-integrated
data:
  config.jsonc: |
    {
      "deploymentMode": "aios-integrated",
      "models": {
        "glm-5": {
          "protocol": "anthropic",
          "baseURL": "${AIOP_MODEL_BASE_URL}",
          "apiKey": "${OPENAI_API_KEY}",
          "model": "glm-5"
        }
      },
      "defaultModel": "glm-5",
      "skills": {
        "dir": "/skills-data",
        "builtinDir": "/app/skills",
        "requireDistributedLock": true
      },
      "auth": {
        "provider": "aios",
        "jwtTtl": "2h",
        "aios": {
          "verify": "userinfo",
          "userinfoUrl": "${AIOS_USERINFO_URL}",
          "systemId": "${AIOS_SYSTEM_ID}",
          "tenantId": "default",
          "fields": {
            "userId": "accountId",
            "tenantId": "tenantId",
            "status": "status",
            "displayName": "displayName",
            "roles": "roles"
          },
          "adminRoles": ["tenant_admin"]
        }
      },
      "sandbox": {
        "enabled": false,
        "provider": "opensandbox",
        "idleMs": 600000,
        "timeoutMs": 3600000,
        "desktop": false
      }
    }
