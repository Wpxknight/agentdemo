# LSTM 版本配置中心
# 添加新版本只需在此文件增加一个条目，无需修改 SKILL.md 或脚本

versions:
  paddle_lstm:
    name: "Paddle-LSTM"
    description: "基于 PaddlePaddle 3.0.0 的经典 LSTM 语言模型"
    image: "crpi-g2y2anh4uack1czy.cn-beijing.personal.cr.aliyuncs.com/xinxin487/jupyter-cuda:paddle3.0.0-lstm"

    # 容器路径
    work_dir: "/home/ubuntu/workspace"
    dataset_container_path: "/home/ubuntu/workspace/data/simple-examples/data"
    builtin_data_path: "/home/ubuntu/workspace/data/data11325/simple-examples/data"
    output_container_path: "/home/ubuntu/workspace/models"

    # 训练配置
    train_script: "train-paddle3x.py"

    # 默认超参数
    defaults:
      model_type: "small"
      rnn_model: "basic_lstm"

    # 可选模型类型
    model_types:
      - value: "small"
        label: "Small（推荐）"
      - value: "medium"
        label: "Medium"
      - value: "large"
        label: "Large"

    # 可选 RNN 模型
    rnn_models:
      - value: "basic_lstm"
        label: "Basic LSTM"

    # 任务名前缀
    task_prefix: "lstm"

    # 框架配置（传给平台 API）
    framework:
      name: "Stardard"
      type: "standalone"

# 共享配置（所有版本继承）
shared:
  # 资源组选择优先关键词
  gpu_keywords:
    - gpu
    - 4090
    - nvidia
    - cuda

  # 调度器配置
  scheduler:
    priorityClassName: "infer-med"
    schedulerName: "volcano"
    queue: "default"
    podGroup: "default"
    strategy: "spreadout"
    minAvailable: 1

  # tensorboard 配置
  tensorboard:
    containerPath: null
    hostPath: null
    autoStopTime: 1
