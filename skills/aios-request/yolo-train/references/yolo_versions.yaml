# 共享配置（所有版本继承）
shared:
  # 资源组选择优先关键词
  gpu_keywords:
    - gpu
    - 4090
    - nvidia
    - cuda

  # 调度器配置
  scheduler:
    priorityClassName: "infer-med"
    schedulerName: "volcano"
    queue: "default"
    podGroup: "default"
    strategy: "spreadout"
    minAvailable: 1

  # tensorboard 配置
  tensorboard:
    containerPath: null
    hostPath: null
    autoStopTime: 1
