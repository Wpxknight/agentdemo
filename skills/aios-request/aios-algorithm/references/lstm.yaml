# LSTM 算法配置
# 添加新 LSTM 版本只需在 versions 下添加条目，无需修改脚本

versions:
  paddle_lstm:
    name: "Paddle-LSTM"
    description: "基于 PaddlePaddle 3.0.0 的经典 LSTM 语言模型"
    image: "crpi-g2y2anh4uack1czy.cn-beijing.personal.cr.aliyuncs.com/xinxin487/jupyter-cuda:paddle3.0.0-lstm"
    require_gpu: true

    # 容器路径
    work_dir: "/home/ubuntu/workspace"
    dataset_container_path: "/home/ubuntu/workspace/data/simple-examples/data"
    builtin_data_path: "/home/ubuntu/workspace/data/data11325/simple-examples/data"
    output_container_path: "/home/ubuntu/workspace/models"

    # 训练配置（供 command_template 引用）
    train_script: "train-paddle3x.py"

    # 命令模板（用 {{var}} 占位，脚本渲染）
    command_template: |
      cd {{work_dir}} && \
      python3 {{train_script}} \
      --use_gpu True \
      --data_path {{data_path}} \
      --model_type {{model_type}} \
      --rnn_model {{rnn_model}}

    # 用户可配置参数定义
    params:
      model_type:
        type: string
        default: "small"
        label: "模型大小"
        required: false
        ask_in_quick: false
        ask_in_custom: true
        options:
          - value: "small"
            label: "Small（推荐）"
          - value: "medium"
            label: "Medium"
          - value: "large"
            label: "Large"
      rnn_model:
        type: string
        default: "basic_lstm"
        label: "RNN 模型类型"
        required: false
        ask_in_quick: false
        ask_in_custom: true
        options:
          - value: "basic_lstm"
            label: "Basic LSTM"

    # 数据集检测策略
    dataset_detection:
      strategy: "list_all"
      description: "需要 PTB（Penn Treebank）文本文件数据集"

    # 数据集挂载策略
    dataset_mount:
      allow_builtin: true
      builtin_data_path: "/home/ubuntu/workspace/data/data11325/simple-examples/data"

    # 任务命名前缀
    task_prefix: "lstm"

    # 框架配置（传给平台 API）
    framework:
      name: "Stardard"
      type: "standalone"

# 共享配置（所有版本继承）
shared:
  gpu_keywords:
    - gpu
    - 4090
    - nvidia
    - cuda

  scheduler:
    priorityClassName: "infer-med"
    schedulerName: "volcano"
    queue: "default"
    podGroup: "default"
    strategy: "spreadout"
    minAvailable: 1

  tensorboard:
    containerPath: null
    hostPath: null
    autoStopTime: 1
