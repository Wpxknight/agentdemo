# PaddleSeg 算法配置
# 基于 BiSeNetV2 模型的图像分割训练，使用 OpticDiscSeg 数据集

versions:
  bisenetv2:
    name: "BiSeNetV2"
    description: "基于 PaddleSeg 的 BiSeNetV2 图像分割模型训练"
    image: "crpi-g2y2anh4uack1czy.cn-beijing.personal.cr.aliyuncs.com/xinxin487/paddleseg:v1.1"
    require_gpu: true

    # 容器路径
    work_dir: "/home/ubuntu/PaddleSeg"
    dataset_container_path: "/home/ubuntu/dataset/optic_disc_seg"
    output_container_path: "/home/ubuntu/PaddleSeg/output"

    # 训练配置（供 command_template 引用）
    cudnn_ld_path: "/opt/conda/envs/jupyter_env/lib:/usr/local/lib/python3.10/dist-packages/nvidia/cudnn/lib:/usr/local/nvidia/lib64"
    train_script: "tools/train.py"
    yml_config: "configs/quick_start/bisenet_optic_disc_512x512_1k.yml"

    # 命令模板（用 {{var}} 占位，脚本渲染）
    command_template: |
      source /opt/conda/etc/profile.d/conda.sh && \
      conda activate jupyter_env && \
      export LD_LIBRARY_PATH={{cudnn_ld_path}}:$LD_LIBRARY_PATH && \
      cd {{work_dir}} && \
      python3 {{train_script}} \
      --config {{yml_config}} \
      --do_eval \
      --save_interval 100 \
      --log_iters 10

    # 用户可配置参数定义
    params: {}

    # 数据集检测策略
    dataset_detection:
      strategy: "list_all"
      description: "需要图像分割数据集（如 OpticDiscSeg 视盘分割数据集）"

    # 数据集挂载策略
    dataset_mount:
      allow_builtin: true
      builtin_data_path: "/home/ubuntu/dataset/optic_disc_seg"

    # 任务命名前缀
    task_prefix: "paddleseg"

    # 框架配置（传给平台 API）
    framework:
      name: "Paddlepaddle"
      type: "standalone"

# 共享配置（所有版本继承）
shared:
  gpu_keywords:
    - gpu
    - 4090
    - nvidia
    - cuda

  scheduler:
    priorityClassName: "infer-med"
    schedulerName: "volcano"
    queue: "default"
    podGroup: "default"
    strategy: "spreadout"
    minAvailable: 1

  tensorboard:
    containerPath: null
    hostPath: null
    autoStopTime: 1
